<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>കുടം പൊട്ടിയാൽ വെള്ളം പോവും</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700;800&family=Manjari:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#FFE9B8;
    --sky-mid:#F7B267;
    --sky-bottom:#E0763B;
    --ground-dark:#3E2417;
    --ground-mid:#5A3320;
    --terracotta:#B5602E;
    --terracotta-dark:#8A4520;
    --rope:#6B4423;
    --gold:#F3C15F;
    --gold-bright:#FFDD8A;
    --ink:#2B1B0E;
    --cream:#FBF1DC;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:var(--ground-dark);
    font-family:'Inter',system-ui,sans-serif;
    touch-action:none;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
  }
  canvas{
    display:block;
    width:100%; height:100%;
    cursor:grab;
  }
  canvas.dragging{ cursor:grabbing; }

  .hint{
    position:absolute;
    top:22px; left:50%; transform:translateX(-50%);
    color:var(--cream);
    font-size:14px;
    letter-spacing:0.02em;
    background:rgba(43,27,14,0.38);
    padding:9px 18px;
    border-radius:999px;
    backdrop-filter:blur(2px);
    transition:opacity 0.6s ease;
    pointer-events:none;
    text-align:center;
  }
  .hint span{
    font-family:'Manjari','Inter',sans-serif;
    opacity:0.85;
    margin-left:6px;
  }
  .hint.hidden{ opacity:0; }

  .score-pill{
    position:absolute;
    top:22px; right:22px;
    color:var(--cream);
    font-size:13px;
    background:rgba(43,27,14,0.38);
    padding:8px 16px;
    border-radius:999px;
    letter-spacing:0.03em;
  }

  /* Golden reveal overlay */
  #reveal{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.1s ease;
  }
  #reveal.show{
    opacity:1;
    pointer-events:auto;
  }
  #reveal .glow-backdrop{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 62% 46%, rgba(255,221,138,0.95) 0%, rgba(243,193,95,0.55) 30%, rgba(90,51,32,0.0) 68%);
    mix-blend-mode:screen;
  }
  #reveal .contrast-scrim{
    position:absolute; inset:0;
    background:radial-gradient(ellipse 62% 48% at 50% 46%, rgba(18,9,4,0.78) 0%, rgba(18,9,4,0.5) 42%, rgba(18,9,4,0) 74%);
  }
  #reveal h1{
    position:relative;
    font-family:'Noto Sans Malayalam', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 5.2vw, 64px);
    color:#FFF3D6;
    text-align:center;
    margin:0 24px;
    max-width:820px;
    line-height:1.5;
    font-feature-settings:"liga" 1, "clig" 1, "akhn" 1, "blwf" 1, "half" 1, "pstf" 1, "vatu" 1, "rphf" 1;
    font-variant-ligatures: common-ligatures contextual;
    text-rendering: optimizeLegibility;
    -webkit-text-stroke: 1.4px rgba(50,24,10,0.65);
    paint-order: stroke fill;
    text-shadow:
      0 2px 0 rgba(50,24,10,0.85),
      0 0 4px rgba(50,24,10,0.6),
      0 0 16px rgba(255,221,138,0.95),
      0 0 36px rgba(255,183,77,0.9),
      0 0 72px rgba(255,150,40,0.65);
    transform:translateY(10px);
    opacity:0;
    transition:opacity 1.4s ease 0.35s, transform 1.4s ease 0.35s;
  }
  #reveal.show h1{
    opacity:1;
    transform:translateY(0);
  }
  #reveal .sub{
    position:relative;
    font-family:'Manjari', sans-serif;
    font-size:15px;
    color:rgba(255,243,214,0.85);
    margin-top:18px;
    opacity:0;
    transition:opacity 1s ease 1s;
  }
  #reveal.show .sub{ opacity:1; }

  #again-btn{
    position:relative;
    margin-top:34px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:none;
    padding:12px 28px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    opacity:0;
    transform:translateY(8px);
    transition:opacity 0.8s ease 1.3s, transform 0.8s ease 1.3s, filter 0.15s ease;
  }
  #reveal.show #again-btn{
    opacity:1;
    transform:translateY(0);
  }
  #again-btn:hover{ filter:brightness(1.06); }
  #again-btn:active{ filter:brightness(0.94); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="hint" id="hint">
    Pull the stone away from the pot to aim — watch the dots — then let go
    <span>കല്ല് പിന്നിലേക്ക് വലിച്ച് ലക്ഷ്യമിട്ട് വിടൂ</span>
  </div>

  <div class="score-pill" id="tries">Tries: 0</div>

  <div id="reveal">
    <div class="glow-backdrop"></div>
    <div class="contrast-scrim"></div>
    <h1>കുടം പൊട്ടിയാൽ വെള്ളം പോവും</h1>
    <div class="sub">the pot breaks, the water goes</div>
    <button id="again-btn">Play again</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const triesEl = document.getElementById('tries');
  const reveal = document.getElementById('reveal');
  const againBtn = document.getElementById('again-btn');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    layout();
  }

  // ----- world geometry (recomputed on resize) -----
  let fork, restPouch, potAnchor, potRestPos, groundY;

  function layout(){
    groundY = H * 0.86;
    fork = { x: W * 0.16, y: groundY - Math.min(H*0.22, 170) };
    restPouch = { x: fork.x, y: fork.y + Math.min(H*0.16, 110) };
    potAnchor = { x: W * 0.78, y: H * 0.10 };
    potRestPos = { x: potAnchor.x, y: Math.min(H*0.5, potAnchor.y + H*0.36) };
  }

  resize();
  window.addEventListener('resize', resize);

  // ----- game state -----
  let tries = 0;
  const GRAVITY = 1250; // px/s^2
  const MAX_STRETCH = () => Math.min(W,H) * 0.30;
  const STONE_R = () => Math.max(8, Math.min(W,H) * 0.014);
  const POT_R = () => Math.max(34, Math.min(W,H) * 0.075);
  const LAUNCH_POWER = 13;

  let pouch = { x:0, y:0 };
  let dragging = false;
  let stoneFlying = false;
  let stone = { x:0, y:0, vx:0, vy:0 };
  let trail = [];

  let pot = {
    broken:false,
    breakOffY:0,
    breakJagged:[],
    shakeT:0,
    shards:[],
    waterActive:false,
    waterElapsed:0,
    swayT: Math.random()*10,
    y:0
  };

  let particles = []; // water drops
  let revealed = false;
  let resetTimer = null;
  let previewPoints = []; // live aim-trajectory dots while dragging

  function resetStone(){
    stoneFlying = false;
    pouch.x = restPouch.x;
    pouch.y = restPouch.y;
    stone.x = pouch.x;
    stone.y = pouch.y;
    stone.vx = 0; stone.vy = 0;
    trail = [];
    previewPoints = [];
  }

  function resetPot(){
    pot.broken = false;
    pot.breakJagged = [];
    pot.shakeT = 0;
    pot.shards = [];
    pot.waterActive = false;
    pot.waterElapsed = 0;
    pot.y = potRestPos.y;
    particles = [];
  }

  function resetAll(){
    resetStone();
    resetPot();
    revealed = false;
    reveal.classList.remove('show');
    hint.classList.remove('hidden');
    tries = 0;
    triesEl.textContent = 'Tries: 0';
  }
  resetStone();
  resetPot();

  // ----- input -----
  function getPointer(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }

  function dist(a,b,x2,y2){
    const dx = a-x2, dy = b-y2;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function onDown(e){
    if(revealed || stoneFlying) return;
    const p = getPointer(e);
    if(dist(p.x,p.y,stone.x,stone.y) < STONE_R()*4){
      dragging = true;
      canvas.classList.add('dragging');
      hint.classList.add('hidden');
      e.preventDefault();
    }
  }

  function computeTrajectory(px, py, vx, vy){
    const pts = [];
    let x = px, y = py, vX = vx, vY = vy;
    const dt = 0.045;
    for(let i=0;i<26;i++){
      vY += GRAVITY*dt;
      x += vX*dt;
      y += vY*dt;
      if(x < -20 || x > W+20 || y > groundY+20) break;
      pts.push({x,y});
    }
    return pts;
  }

  function onMove(e){
    if(!dragging) return;
    const p = getPointer(e);
    let dx = p.x - fork.x;
    let dy = p.y - fork.y;
    let d = Math.sqrt(dx*dx+dy*dy);
    const max = MAX_STRETCH();
    if(d > max){
      dx = dx/d*max;
      dy = dy/d*max;
    }
    pouch.x = fork.x + dx;
    pouch.y = fork.y + dy;
    stone.x = pouch.x;
    stone.y = pouch.y;

    const lvx = (restPouch.x - pouch.x) * LAUNCH_POWER;
    const lvy = (restPouch.y - pouch.y) * LAUNCH_POWER;
    previewPoints = computeTrajectory(pouch.x, pouch.y, lvx, lvy);

    e.preventDefault();
  }

  function onUp(e){
    if(!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    previewPoints = [];
    const dx = restPouch.x - pouch.x;
    const dy = restPouch.y - pouch.y;
    const speed = Math.sqrt(dx*dx+dy*dy);
    if(speed < 6){
      // barely pulled, snap back
      resetStone();
      return;
    }
    stone.vx = dx * LAUNCH_POWER;
    stone.vy = dy * LAUNCH_POWER;
    stoneFlying = true;
    tries++;
    triesEl.textContent = 'Tries: ' + tries;
  }

  canvas.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);

  againBtn.addEventListener('click', resetAll);

  // ----- physics + collision -----
  function spawnWaterBurst(x,y,n){
    for(let i=0;i<n;i++){
      const ang = (Math.random()*Math.PI*0.7) + Math.PI*0.15; // downward-ish spread
      const spd = 130 + Math.random()*280;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd * (Math.random()<0.5?-1:1),
        vy: -Math.abs(Math.sin(ang)) * spd * 0.5 - 40,
        r: 2.2 + Math.random()*3.6,
        life: 1,
        decay: 0.3 + Math.random()*0.35
      });
    }
  }

  function spawnWaterStream(cx, y, r, n){
    for(let i=0;i<n;i++){
      particles.push({
        x: cx + (Math.random()-0.5) * r * 1.4,
        y: y + Math.random()*6,
        vx: (Math.random()-0.5) * 50,
        vy: 70 + Math.random()*110,
        r: 2.5 + Math.random()*3.8,
        life: 1,
        decay: 0.22 + Math.random()*0.28
      });
    }
  }

  function makeBreakLine(r){
    const pts = [];
    const n = 7;
    for(let i=0;i<=n;i++){
      const x = -r*1.1 + (r*2.2) * (i/n);
      const y = (Math.random()-0.5) * r*0.22;
      pts.push({x,y});
    }
    return pts;
  }

  function spawnShards(cx, cy, r){
    pot.shards = [];
    const n = 8 + Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const u = i/(n-1); // 0..1 across the width
      const localX = (u - 0.5) * r * 1.9;
      const localY = pot.breakOffY + r*(0.18 + Math.random()*0.55);
      const size = r * (0.16 + Math.random()*0.15);
      const sides = 3 + Math.floor(Math.random()*2);
      const shape = [];
      for(let s=0;s<sides;s++){
        const ang = (Math.PI*2/sides)*s + (Math.random()-0.5)*0.5;
        const rad = size * (0.6 + Math.random()*0.5);
        shape.push({x:Math.cos(ang)*rad, y:Math.sin(ang)*rad});
      }
      pot.shards.push({
        x: cx + localX,
        y: cy + localY,
        vx: (u-0.5) * (90 + Math.random()*100),
        vy: -30 - Math.random()*60,
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5) * 6,
        shape
      });
    }
  }

  function triggerHit(hx,hy,ocx,ocy){
    if(pot.broken) return;
    pot.broken = true;
    const r = POT_R();
    pot.breakOffY = r * 0.22;
    pot.breakJagged = makeBreakLine(r);
    pot.shakeT = 0.5;
    pot.waterActive = true;
    pot.waterElapsed = 0;
    spawnShards(ocx, ocy, r);
    spawnWaterBurst(ocx, ocy + pot.breakOffY, 90);
    hint.classList.add('hidden');
    resetTimer = setTimeout(()=>{
      revealed = true;
      trail = [];
      reveal.classList.add('show');
    }, 1900);
  }

  let lastT = performance.now();
  function update(t){
    const dt = Math.min((t - lastT)/1000, 0.033);
    lastT = t;

    pot.swayT += dt;
    let sway;
    if(pot.broken){
      pot.shakeT = Math.max(0, pot.shakeT - dt);
      sway = Math.sin(pot.swayT*50) * 7 * (pot.shakeT/0.5);
    } else {
      sway = Math.sin(pot.swayT*1.1) * 6;
    }
    pot.y = potRestPos.y;
    const potCx = potAnchor.x + sway;
    const potCy = pot.y;

    if(pot.broken){
      for(let i=pot.shards.length-1;i>=0;i--){
        const s = pot.shards[i];
        s.vy += GRAVITY*0.85*dt;
        s.x += s.vx*dt;
        s.y += s.vy*dt;
        s.rot += s.vrot*dt;
        if(s.y > groundY + 60) pot.shards.splice(i,1);
      }
      if(pot.waterActive){
        pot.waterElapsed += dt;
        if(pot.waterElapsed < 1.15){
          const count = Math.max(1, Math.round(190*dt));
          spawnWaterStream(potCx, potCy + pot.breakOffY, POT_R(), count);
        } else {
          pot.waterActive = false;
        }
      }
    }

    if(stoneFlying){
      stone.vy += GRAVITY*dt;
      stone.x += stone.vx*dt;
      stone.y += stone.vy*dt;
      trail.push({x:stone.x,y:stone.y});
      if(trail.length>14) trail.shift();

      if(!pot.broken){
        const d = dist(stone.x,stone.y,potCx,potCy);
        if(d < POT_R()*1.1 + STONE_R()*2){
          triggerHit(stone.x, stone.y, potCx, potCy);
          stoneFlying = false;
        }
      }

      if(stone.x < -50 || stone.x > W+50 || stone.y > H+80){
        stoneFlying = false;
        if(!revealed){
          setTimeout(()=>{ if(!revealed) resetStone(); }, 350);
        }
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vy += GRAVITY*0.7*dt;
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.life -= p.decay*dt;
      if(p.y > groundY + 20 || p.life <= 0) particles.splice(i,1);
    }

    draw(potCx, potCy);
    requestAnimationFrame(update);
  }

  // ----- drawing -----
  function drawSky(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#FFE9B8');
    g.addColorStop(0.55, '#F7B267');
    g.addColorStop(1, '#E0763B');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // sun glow
    const sunX = W*0.5, sunY = H*0.22;
    const sg = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,W*0.4);
    sg.addColorStop(0,'rgba(255,244,214,0.9)');
    sg.addColorStop(1,'rgba(255,244,214,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0,0,W,H);
  }

  function drawGround(){
    const g = ctx.createLinearGradient(0,groundY,0,H);
    g.addColorStop(0,'#5A3320');
    g.addColorStop(1,'#2E1A10');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0,groundY);
    ctx.lineTo(W,groundY);
    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();

    // simple grass tufts
    ctx.strokeStyle = 'rgba(90,140,60,0.55)';
    ctx.lineWidth = 2;
    for(let i=0;i<W;i+=26){
      const h = 6 + (Math.sin(i*0.7)+1)*4;
      ctx.beginPath();
      ctx.moveTo(i, groundY+2);
      ctx.lineTo(i-4, groundY-h+2);
      ctx.moveTo(i, groundY+2);
      ctx.lineTo(i+4, groundY-h+2);
      ctx.stroke();
    }
  }

  function drawPole(){
    // wooden pole/branch that pot hangs from, from top of screen down to potAnchor
    ctx.strokeStyle = '#4A2F1C';
    ctx.lineWidth = Math.max(6, W*0.012);
    ctx.beginPath();
    ctx.moveTo(potAnchor.x, -10);
    ctx.lineTo(potAnchor.x, potAnchor.y);
    ctx.stroke();
    // small horizontal branch
    ctx.beginPath();
    ctx.moveTo(potAnchor.x - 40, potAnchor.y+4);
    ctx.lineTo(potAnchor.x + 40, potAnchor.y+4);
    ctx.lineWidth = Math.max(5, W*0.009);
    ctx.stroke();
  }

  function drawSling(){
    // wooden stand: two prongs meeting at fork
    ctx.strokeStyle = '#4A2F1C';
    ctx.lineWidth = Math.max(7, W*0.013);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fork.x - 26, fork.y - 34);
    ctx.lineTo(fork.x, fork.y);
    ctx.moveTo(fork.x + 26, fork.y - 34);
    ctx.lineTo(fork.x, fork.y);
    ctx.moveTo(fork.x, fork.y);
    ctx.lineTo(fork.x, groundY);
    ctx.stroke();

    // elastic bands to pouch
    ctx.strokeStyle = '#3B2416';
    ctx.lineWidth = Math.max(3, W*0.006);
    ctx.beginPath();
    ctx.moveTo(fork.x - 26, fork.y - 34);
    ctx.lineTo(pouch.x, pouch.y);
    ctx.moveTo(fork.x + 26, fork.y - 34);
    ctx.lineTo(pouch.x, pouch.y);
    ctx.stroke();
  }

  function drawStoneTrail(){
    for(let i=0;i<trail.length;i++){
      const p = trail[i];
      const a = (i/trail.length)*0.35;
      ctx.fillStyle = `rgba(60,40,25,${a})`;
      ctx.beginPath();
      ctx.arc(p.x,p.y, STONE_R()*0.7, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawStone(){
    if(revealed) return;
    ctx.save();
    ctx.fillStyle = '#4A4038';
    ctx.beginPath();
    ctx.arc(stone.x, stone.y, STONE_R(), 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.arc(stone.x - STONE_R()*0.3, stone.y - STONE_R()*0.3, STONE_R()*0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawPreview(){
    if(!dragging || previewPoints.length === 0) return;
    for(let i=0;i<previewPoints.length;i++){
      const p = previewPoints[i];
      const a = 0.75 * (1 - i/previewPoints.length);
      ctx.fillStyle = `rgba(255,243,214,${a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(2, STONE_R()*0.32), 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawPotBody(cx,cy,r){
    const grad = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
    grad.addColorStop(0, '#C97A45');
    grad.addColorStop(0.55, '#B5602E');
    grad.addColorStop(1, '#8A4520');
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(cx - r*0.32, cy - r*1.05);
    ctx.quadraticCurveTo(cx - r*0.55, cy - r*0.85, cx - r*0.55, cy - r*0.5);
    ctx.quadraticCurveTo(cx - r*1.05, cy - r*0.1, cx - r*0.82, cy + r*0.55);
    ctx.quadraticCurveTo(cx - r*0.5, cy + r*1.05, cx, cy + r*1.1);
    ctx.quadraticCurveTo(cx + r*0.5, cy + r*1.05, cx + r*0.82, cy + r*0.55);
    ctx.quadraticCurveTo(cx + r*1.05, cy - r*0.1, cx + r*0.55, cy - r*0.5);
    ctx.quadraticCurveTo(cx + r*0.55, cy - r*0.85, cx + r*0.32, cy - r*1.05);
    ctx.closePath();
    ctx.fill();

    // neck rim
    ctx.fillStyle = '#8A4520';
    ctx.beginPath();
    ctx.ellipse(cx, cy - r*1.05, r*0.34, r*0.13, 0, 0, Math.PI*2);
    ctx.fill();

    // decorative band
    ctx.strokeStyle = 'rgba(255,238,214,0.5)';
    ctx.lineWidth = Math.max(2, r*0.05);
    ctx.beginPath();
    ctx.ellipse(cx, cy + r*0.05, r*0.95, r*0.35, 0, 0, Math.PI);
    ctx.stroke();
  }

  function drawPot(cx,cy){
    const r = POT_R();
    ctx.save();

    // rope from branch to pot
    ctx.strokeStyle = '#6B4423';
    ctx.lineWidth = Math.max(2.5, W*0.005);
    ctx.beginPath();
    ctx.moveTo(potAnchor.x, potAnchor.y+4);
    ctx.lineTo(cx, cy - r*1.15);
    ctx.stroke();

    if(!pot.broken){
      drawPotBody(cx,cy,r);
    } else {
      const breakYAbs = cy + pot.breakOffY;

      // clip away everything below the jagged break line, then draw the
      // full body so only the surviving upper portion of the pot remains
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx - r*1.4, cy - r*1.5);
      ctx.lineTo(cx + r*1.4, cy - r*1.5);
      ctx.lineTo(cx + r*1.4, breakYAbs);
      for(let i=pot.breakJagged.length-1;i>=0;i--){
        const p = pot.breakJagged[i];
        ctx.lineTo(cx+p.x, breakYAbs+p.y);
      }
      ctx.lineTo(cx - r*1.4, breakYAbs);
      ctx.closePath();
      ctx.clip();
      drawPotBody(cx,cy,r);
      ctx.restore();

      // dark broken rim along the jagged edge, for a sense of thickness
      ctx.strokeStyle = 'rgba(50,24,12,0.85)';
      ctx.lineWidth = Math.max(2, r*0.06);
      ctx.beginPath();
      pot.breakJagged.forEach((p,i)=>{
        const px = cx+p.x, py = breakYAbs+p.y;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      });
      ctx.stroke();

      // hollow dark interior glimpsed just above the break
      ctx.fillStyle = 'rgba(35,18,9,0.55)';
      ctx.beginPath();
      pot.breakJagged.forEach((p,i)=>{
        const px = cx+p.x, py = breakYAbs+p.y - r*0.08;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      });
      pot.breakJagged.slice().reverse().forEach(p=>{
        ctx.lineTo(cx+p.x, breakYAbs+p.y);
      });
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawShards(){
    pot.shards.forEach(s=>{
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      const grad = ctx.createLinearGradient(-8,-8,8,8);
      grad.addColorStop(0, '#C97A45');
      grad.addColorStop(1, '#8A4520');
      ctx.fillStyle = grad;
      ctx.beginPath();
      s.shape.forEach((p,i)=>{
        if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(50,24,12,0.6)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.restore();
    });
  }

  function drawWater(){
    particles.forEach(p=>{
      ctx.fillStyle = `rgba(120,190,225,${Math.max(0,p.life)})`;
      ctx.beginPath();
      ctx.ellipse(p.x,p.y,p.r,p.r*1.3,0,0,Math.PI*2);
      ctx.fill();
    });
  }

  function draw(potCx,potCy){
    ctx.clearRect(0,0,W,H);
    drawSky();
    drawGround();
    drawPole();
    drawPot(potCx,potCy);
    drawShards();
    drawWater();
    drawSling();
    drawPreview();
    drawStoneTrail();
    drawStone();
  }

  requestAnimationFrame(update);
})();
</script>
</body>
</html>
