<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>കാക്ക കുളിച്ചാൽ കൊക്കാവില്ല</title>
<meta name="description" content="കാക്കയെ കുളിപ്പിക്കൂ, സോപ്പ് തേക്കൂ, എന്ത് സംഭവിക്കുന്നു എന്ന് നോക്കൂ.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🐦‍⬛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#0F3A52;
    --sky-mid:#3D7A8C;
    --sky-bottom:#F6C978;
    --tile:#E4EDE9;
    --tile-grout:#9FB9AE;
    --floor:#C9AF88;
    --floor-grout:#8A7248;
    --crow:#20242B;
    --crow-belly:#3A3F47;
    --water:#8FD3EA;
    --water-deep:#4FA9C7;
    --ink:#122019;
    --panel:#FFF7E8;
    --panel-edge:#E7CFA0;
    --focus:#FF7A3D;
    --btn:#0F3A52;
    --btn-text:#FFF7E8;
    --btn-soap:#3D8C6B;
    --btn-reset:#B65C2E;
    font-size:16px;
  }

  *{box-sizing:border-box;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:
      radial-gradient(1200px 700px at 50% -10%, var(--sky-mid), transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%);
    background-attachment:fixed;
    font-family:'Inter', sans-serif;
    color:var(--ink);
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.2rem 1.1rem 3rem;
  }

  header{
    text-align:center;
    max-width:34rem;
    margin-bottom:1.4rem;
  }

  h1{
    font-family:'Noto Sans Malayalam','Meera','Rachana',sans-serif;
    font-weight:800;
    font-size:clamp(1.9rem, 6vw, 2.9rem);
    line-height:1.15;
    margin:0 0 .5rem;
    color:#FFF7E8;
    text-shadow: 0 2px 0 rgba(0,0,0,.18);
  }

  .sub{
    font-family:'Noto Sans Malayalam','Meera','Rachana',sans-serif;
    font-size:1.05rem;
    color:#FFF1D6;
    margin:0;
    opacity:.92;
  }

  .sub em{
    font-style:normal;
    font-weight:600;
    color:#FFDDA6;
  }

  /* ---------- STAGE ---------- */

  .stage-wrap{
    position:relative;
    width:min(92vw, 400px);
    filter:drop-shadow(0 18px 30px rgba(10,20,20,.35));
  }

  svg.stage{
    display:block;
    width:100%;
    height:auto;
    border-radius:22px;
    overflow:hidden;
  }

  .water-drop{
    opacity:0;
    transform-origin:center;
  }
  .stage[data-flow="on"] .water-drop{
    animation:fall 0.9s linear infinite;
  }
  @keyframes fall{
    0%{opacity:0; transform:translateY(0) scaleY(0.6);}
    12%{opacity:1;}
    85%{opacity:1;}
    100%{opacity:0; transform:translateY(200px) scaleY(1.3);}
  }

  .puddle{
    opacity:0;
    transition:opacity .5s ease .3s;
  }
  .stage[data-flow="on"] .puddle{opacity:1;}

  .bird-group{
    transform-origin:200px 420px;
  }
  .stage[data-anim="idle-bob"] .bird-group{
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }

  .wet-shine{
    opacity:0;
    transition:opacity .4s ease;
    pointer-events:none;
  }
  .stage[data-wet="1"] .wet-shine{opacity:1;}
  .stage[data-wet="1"] .bird-group .bird-fill{
    filter:saturate(1.15) brightness(.94);
  }

  .soap-bar{
    opacity:0;
    transform-origin:center;
    transition:opacity .25s ease;
  }
  .stage[data-soaping="1"] .soap-bar{
    opacity:1;
    animation:scrub 0.4s ease-in-out infinite;
  }
  @keyframes scrub{
    0%,100%{transform:rotate(-14deg) translateX(0);}
    50%{transform:rotate(14deg) translateX(6px);}
  }

  .bubble{
    opacity:0;
    transform:scale(.2);
    transform-box:fill-box;
    transform-origin:center;
    transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
  }
  .stage[data-soaping="1"] .bubble,
  .stage[data-bubbles="cover"] .bubble{
    opacity:1;
    transform:scale(1);
  }
  .stage[data-bubbles="pop"] .bubble{
    opacity:0;
    transform:scale(1.5);
    transition:transform .55s ease-in, opacity .55s ease-in;
  }
  .bubble:nth-child(1){transition-delay:.02s;}
  .bubble:nth-child(2){transition-delay:.08s;}
  .bubble:nth-child(3){transition-delay:.05s;}
  .bubble:nth-child(4){transition-delay:.12s;}
  .bubble:nth-child(5){transition-delay:.03s;}
  .bubble:nth-child(6){transition-delay:.15s;}
  .bubble:nth-child(7){transition-delay:.09s;}
  .bubble:nth-child(8){transition-delay:.06s;}
  .bubble:nth-child(9){transition-delay:.18s;}
  .bubble:nth-child(10){transition-delay:.11s;}
  .bubble:nth-child(11){transition-delay:.14s;}
  .bubble:nth-child(12){transition-delay:.04s;}

  .sparkle{
    opacity:0;
    transform:scale(.3);
    transform-box:fill-box;
    transform-origin:center;
  }
  .stage[data-sparkle="1"] .sparkle{
    animation:pop-sparkle .8s ease-out forwards;
  }
  .sparkle:nth-child(2){animation-delay:.05s;}
  .sparkle:nth-child(3){animation-delay:.1s;}
  .sparkle:nth-child(4){animation-delay:.02s;}
  .sparkle:nth-child(5){animation-delay:.14s;}
  .sparkle:nth-child(6){animation-delay:.07s;}
  .sparkle:nth-child(7){animation-delay:.16s;}
  .sparkle:nth-child(8){animation-delay:.03s;}
  @keyframes pop-sparkle{
    0%{opacity:0; transform:scale(.2);}
    35%{opacity:1; transform:scale(1.15);}
    100%{opacity:0; transform:scale(.6) translateY(-14px);}
  }

  /* ---------- CONTROLS ---------- */

  .controls{
    width:min(92vw, 400px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.85rem;
    margin-top:1.4rem;
  }

  button{
    font-family:'Noto Sans Malayalam','Meera','Rachana',sans-serif;
    font-weight:700;
    font-size:1.08rem;
    border:none;
    border-radius:999px;
    padding:.85rem 1.8rem;
    cursor:pointer;
    color:var(--btn-text);
    background:var(--btn);
    box-shadow:0 4px 0 rgba(0,0,0,.22), 0 8px 16px rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .12s ease;
    display:none;
  }
  button.visible{display:inline-block;}
  button:hover{transform:translateY(-2px);}
  button:active{transform:translateY(1px); box-shadow:0 2px 0 rgba(0,0,0,.22);}
  button:focus-visible{outline:3px solid var(--focus); outline-offset:3px;}
  button:disabled{opacity:.55; cursor:default; transform:none;}

  #soapBtn{background:var(--btn-soap);}
  #resetBtn{background:var(--btn-reset);}

  .caption{
    width:100%;
    max-width:400px;
    background:var(--panel);
    border:2px solid var(--panel-edge);
    border-radius:16px;
    padding:.95rem 1.15rem;
    text-align:center;
    display:none;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
  }
  .caption.visible{display:block;}
  .caption .ml{
    font-family:'Noto Sans Malayalam','Meera','Rachana',sans-serif;
    font-weight:700;
    font-size:1.15rem;
    margin:0 0 .2rem;
  }
  .caption .en{
    font-size:.85rem;
    color:#556;
    margin:0;
  }

  footer{
    margin-top:2.2rem;
    text-align:center;
    font-size:.78rem;
    color:#FFF1D6;
    opacity:.75;
    max-width:26rem;
  }
  footer a{color:#FFDDA6;}
</style>
</head>
<body>

<div class="page">

  <header>
    <h1>കാക്ക കുളിച്ചാൽ കൊക്കാവില്ല</h1>
    <p class="sub">പഴഞ്ചൊല്ല് പറയുന്നു, കാക്ക കുളിച്ചാൽ <em>കൊക്കാവില്ല</em> എന്ന്. ശരിയാണോ എന്ന് നമുക്ക് നോക്കാം — ഷവർ ഓണാക്കി കാക്കയെ സോപ്പിട്ട് കുളിപ്പിക്കൂ.</p>
  </header>

  <div class="stage-wrap">
    <svg class="stage" id="stage" data-flow="off" data-wet="0" data-soaping="0" data-bubbles="hide" data-sparkle="0" data-anim="idle-bob" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ഒരു കാക്ക ഷവറിനടിയിൽ നിൽക്കുന്ന ദൃശ്യം">

      <defs>
        <pattern id="wallTile" width="22" height="22" patternUnits="userSpaceOnUse">
          <rect width="22" height="22" fill="var(--tile)"/>
          <rect width="21" height="21" fill="none" stroke="var(--tile-grout)" stroke-width="1"/>
        </pattern>
        <pattern id="floorTile" width="46" height="16" patternUnits="userSpaceOnUse">
          <rect width="46" height="16" fill="var(--floor)"/>
          <rect width="45" height="15" fill="none" stroke="var(--floor-grout)" stroke-width="1"/>
        </pattern>
        <linearGradient id="skyGlow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#DFF1F7"/>
          <stop offset="1" stop-color="#F4E3C6"/>
        </linearGradient>
      </defs>

      <!-- wall + floor -->
      <rect x="0" y="0" width="400" height="440" fill="url(#wallTile)"/>
      <rect x="0" y="440" width="400" height="80" fill="url(#floorTile)"/>
      <rect x="0" y="0" width="400" height="440" fill="url(#skyGlow)" opacity="0.12"/>

      <!-- shower pipe + head -->
      <rect x="188" y="0" width="16" height="46" fill="#A9B7BC"/>
      <rect x="188" y="0" width="6" height="46" fill="#CBD6D9"/>
      <g transform="translate(0,0)">
        <rect x="140" y="42" width="120" height="26" rx="13" fill="#B7C4C8" stroke="#8FA0A6" stroke-width="2"/>
        <rect x="140" y="42" width="120" height="10" rx="5" fill="#CDD8DB"/>
        <g fill="#7D8E93">
          <circle cx="155" cy="68" r="2.4"/><circle cx="169" cy="68" r="2.4"/><circle cx="183" cy="68" r="2.4"/>
          <circle cx="197" cy="68" r="2.4"/><circle cx="211" cy="68" r="2.4"/><circle cx="225" cy="68" r="2.4"/>
          <circle cx="239" cy="68" r="2.4"/><circle cx="253" cy="68" r="2.4"/>
        </g>
      </g>

      <!-- water -->
      <g id="waterGroup">
        <rect class="water-drop" x="153" y="70" width="4" height="26" rx="2" fill="var(--water)" style="animation-delay:-.05s"/>
        <rect class="water-drop" x="167" y="70" width="4" height="26" rx="2" fill="var(--water-deep)" style="animation-delay:-.28s"/>
        <rect class="water-drop" x="181" y="70" width="4" height="26" rx="2" fill="var(--water)" style="animation-delay:-.5s"/>
        <rect class="water-drop" x="195" y="70" width="4" height="26" rx="2" fill="var(--water-deep)" style="animation-delay:-.14s"/>
        <rect class="water-drop" x="209" y="70" width="4" height="26" rx="2" fill="var(--water)" style="animation-delay:-.38s"/>
        <rect class="water-drop" x="223" y="70" width="4" height="26" rx="2" fill="var(--water-deep)" style="animation-delay:-.62s"/>
        <rect class="water-drop" x="237" y="70" width="4" height="26" rx="2" fill="var(--water)" style="animation-delay:-.2s"/>
        <rect class="water-drop" x="251" y="70" width="4" height="26" rx="2" fill="var(--water-deep)" style="animation-delay:-.44s"/>
      </g>

      <!-- puddle -->
      <ellipse class="puddle" cx="200" cy="452" rx="72" ry="12" fill="var(--water)" opacity="0.55"/>
      <ellipse class="puddle" cx="200" cy="452" rx="46" ry="7" fill="var(--water-deep)" opacity="0.4"/>

      <!-- bird -->
      <g class="bird-group" id="birdGroup"></g>

      <!-- wet shine overlay -->
      <g class="wet-shine">
        <path d="M172,300 Q168,330 176,358" stroke="#EAF7FB" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>
        <path d="M226,310 Q232,336 224,360" stroke="#EAF7FB" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45"/>
      </g>

      <!-- soap bar -->
      <g class="soap-bar" transform="translate(255,330)">
        <rect x="-22" y="-12" width="44" height="24" rx="10" fill="#FFE8B0" stroke="#E8B85C" stroke-width="2"/>
        <path d="M-12,0 Q0,-6 12,0" stroke="#E8B85C" stroke-width="2" fill="none" opacity="0.7"/>
      </g>

      <!-- bubbles -->
      <g id="bubbleGroup">
        <circle class="bubble" cx="168" cy="330" r="30" fill="#FFFFFF" opacity="0.94"/>
        <circle class="bubble" cx="222" cy="320" r="34" fill="#FFFFFF" opacity="0.94"/>
        <circle class="bubble" cx="196" cy="360" r="38" fill="#FFFFFF" opacity="0.96"/>
        <circle class="bubble" cx="150" cy="370" r="24" fill="#F4FBFD" opacity="0.94"/>
        <circle class="bubble" cx="242" cy="365" r="26" fill="#F4FBFD" opacity="0.94"/>
        <circle class="bubble" cx="200" cy="290" r="26" fill="#FFFFFF" opacity="0.95"/>
        <circle class="bubble" cx="180" cy="400" r="20" fill="#FFFFFF" opacity="0.92"/>
        <circle class="bubble" cx="220" cy="402" r="18" fill="#F4FBFD" opacity="0.92"/>
        <circle class="bubble" cx="160" cy="300" r="14" fill="#FFFFFF" opacity="0.9"/>
        <circle class="bubble" cx="238" cy="295" r="12" fill="#FFFFFF" opacity="0.9"/>
        <circle class="bubble" cx="205" cy="415" r="14" fill="#FFFFFF" opacity="0.9"/>
        <circle class="bubble" cx="145" cy="340" r="12" fill="#FFFFFF" opacity="0.88"/>
      </g>

      <!-- sparkles on reveal -->
      <g id="sparkleGroup" fill="#FFE59A">
        <path class="sparkle" d="M150,260 l4,12 12,4 -12,4 -4,12 -4,-12 -12,-4 12,-4 z"/>
        <path class="sparkle" d="M250,270 l3,9 9,3 -9,3 -3,9 -3,-9 -9,-3 9,-3 z"/>
        <path class="sparkle" d="M200,240 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 z"/>
        <path class="sparkle" d="M130,340 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
        <path class="sparkle" d="M270,330 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
        <path class="sparkle" d="M170,420 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
        <path class="sparkle" d="M235,410 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
        <path class="sparkle" d="M200,400 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
      </g>

    </svg>
  </div>

  <div class="controls">
    <button id="showerBtn" class="visible" type="button">ഷവർ ഓൺ ചെയ്യുക</button>
    <button id="soapBtn" type="button">സോപ്പ് തേക്കുക</button>
    <div class="caption" id="caption" role="status" aria-live="polite">
      <p class="ml" id="captionMl"></p>
      <p class="en" id="captionEn"></p>
    </div>
    <button id="resetBtn" type="button">വീണ്ടും കുളിപ്പിക്കാം</button>
  </div>

  <footer>
    ഓർമ്മിക്കുക: എത്ര കുളിച്ചാലും ഇത് ഒരിക്കലും ഒരു <strong>കൊക്ക്</strong> ആവില്ല. ബാക്കി ഏത് പക്ഷിയും ആവാം.
  </footer>

</div>

<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');
  var birdGroup = document.getElementById('birdGroup');
  var showerBtn = document.getElementById('showerBtn');
  var soapBtn = document.getElementById('soapBtn');
  var resetBtn = document.getElementById('resetBtn');
  var caption = document.getElementById('caption');
  var captionMl = document.getElementById('captionMl');
  var captionEn = document.getElementById('captionEn');

  var LEG_TEMPLATE = function(x1,x2,color){
    return '<path d="M'+x1+',415 L'+(x1-3)+',441" stroke="'+color+'" stroke-width="6" stroke-linecap="round"/>' +
           '<path d="M'+x2+',415 L'+(x2+3)+',441" stroke="'+color+'" stroke-width="6" stroke-linecap="round"/>' +
           '<path d="M'+(x1-11)+',441 l-9,4 M'+(x1-3)+',441 l0,7 M'+(x1+5)+',441 l8,4" stroke="'+color+'" stroke-width="4" stroke-linecap="round" fill="none"/>' +
           '<path d="M'+(x2-5)+',441 l-8,4 M'+(x2+3)+',441 l0,7 M'+(x2+11)+',441 l9,4" stroke="'+color+'" stroke-width="4" stroke-linecap="round" fill="none"/>';
  };

  var CROW =
    '<ellipse class="bird-fill" cx="200" cy="345" rx="46" ry="58" fill="#20242B"/>' +
    '<ellipse cx="207" cy="368" rx="28" ry="32" fill="#33383F" opacity="0.55"/>' +
    '<path d="M160,300 Q136,338 162,382 Q176,352 170,318 Z" fill="#171A1F"/>' +
    '<path d="M150,318 Q118,328 128,362 Q146,346 150,318 Z" fill="#171A1F"/>' +
    '<circle class="bird-fill" cx="205" cy="280" r="33" fill="#20242B"/>' +
    '<path d="M232,278 Q264,282 262,290 Q246,297 230,292 Z" fill="#2B2B2E"/>' +
    '<circle cx="222" cy="270" r="5" fill="#0B0B0C"/><circle cx="224" cy="268" r="1.6" fill="#FFFFFF"/>' +
    LEG_TEMPLATE(183,218,'#D98A2B');

  var BIRDS = {
    peacock: {
      ml: 'മയിൽ', en: 'It is now a peacock.',
      svg:
        (function(){
          var feathers = '';
          var angles = [-60,-40,-20,0,20,40,60];
          var colors = ['#0B3D91','#123F7A','#0B3D91','#123F7A','#0B3D91','#123F7A','#0B3D91'];
          for (var i=0;i<angles.length;i++){
            feathers += '<g transform="rotate('+angles[i]+' 200 380)">' +
              '<line x1="200" y1="380" x2="200" y2="255" stroke="'+colors[i]+'" stroke-width="7" stroke-linecap="round"/>' +
              '<circle cx="200" cy="250" r="11" fill="'+colors[i]+'"/>' +
              '<circle cx="200" cy="250" r="7" fill="#2E9E6B"/>' +
              '<circle cx="200" cy="250" r="3" fill="#F2C14E"/>' +
              '</g>';
          }
          return feathers +
            '<ellipse class="bird-fill" cx="200" cy="345" rx="40" ry="50" fill="#1C5FA8"/>' +
            '<ellipse cx="205" cy="365" rx="22" ry="26" fill="#2E7FCB" opacity="0.5"/>' +
            '<circle class="bird-fill" cx="205" cy="278" r="26" fill="#1C5FA8"/>' +
            '<line x1="200" y1="252" x2="196" y2="232" stroke="#1C5FA8" stroke-width="3" stroke-linecap="round"/>' +
            '<line x1="205" y1="250" x2="206" y2="228" stroke="#1C5FA8" stroke-width="3" stroke-linecap="round"/>' +
            '<line x1="210" y1="252" x2="215" y2="232" stroke="#1C5FA8" stroke-width="3" stroke-linecap="round"/>' +
            '<circle cx="196" cy="230" r="3" fill="#59C6A0"/><circle cx="206" cy="226" r="3" fill="#59C6A0"/><circle cx="215" cy="230" r="3" fill="#59C6A0"/>' +
            '<path d="M228,276 Q246,278 244,285 Q234,289 226,285 Z" fill="#2B2B2E"/>' +
            '<circle cx="216" cy="270" r="4.5" fill="#0B0B0C"/><circle cx="218" cy="268" r="1.4" fill="#FFFFFF"/>' +
            LEG_TEMPLATE(188,214,'#7A7A7A');
        })()
    },

    hornbill: {
      ml: 'വേഴാമ്പൽ', en: 'It is now a hornbill \u2014 Kerala\u2019s state bird.',
      svg:
        '<ellipse class="bird-fill" cx="200" cy="345" rx="44" ry="56" fill="#16181C"/>' +
        '<ellipse cx="200" cy="368" rx="34" ry="16" fill="#F5F1E6"/>' +
        '<path d="M162,318 Q206,406 200,414 Q186,404 172,392 Q182,358 162,318 Z" fill="#16181C"/>' +
        '<rect x="180" y="406" width="40" height="10" fill="#F5F1E6"/>' +

  var birdKeys = Object.keys(BIRDS);
  var lastBird = null;

  function pickBird(){
    var k;
    do { k = birdKeys[Math.floor(Math.random()*birdKeys.length)]; }
    while (birdKeys.length > 1 && k === lastBird);
    lastBird = k;
    return k;
  }

  function setBird(svgMarkup){
    birdGroup.innerHTML = svgMarkup;
  }

  function resetAll(){
    stage.setAttribute('data-flow','off');
    stage.setAttribute('data-wet','0');
    stage.setAttribute('data-soaping','0');
    stage.setAttribute('data-bubbles','hide');
    stage.setAttribute('data-sparkle','0');
    setBird(CROW);
    showerBtn.classList.add('visible');
    showerBtn.disabled = false;
    soapBtn.classList.remove('visible');
    soapBtn.disabled = false;
    resetBtn.classList.remove('visible');
    caption.classList.remove('visible');
    captionMl.textContent = '';
    captionEn.textContent = '';
    stage.setAttribute('aria-label','ഒരു കാക്ക ഷവറിനടിയിൽ നിൽക്കുന്ന ദൃശ്യം');
  }

  showerBtn.addEventListener('click', function(){
    stage.setAttribute('data-flow','on');
    stage.setAttribute('data-wet','1');
    showerBtn.disabled = true;
    window.setTimeout(function(){
      soapBtn.classList.add('visible');
    }, 500);
  });

  soapBtn.addEventListener('click', function(){
    soapBtn.disabled = true;
    stage.setAttribute('data-soaping','1');
    stage.setAttribute('data-bubbles','cover');

    window.setTimeout(function(){
      var key = pickBird();
      var bird = BIRDS[key];
      setBird(bird.svg);
      stage.setAttribute('data-wet','0');
      stage.setAttribute('data-soaping','0');
      stage.setAttribute('data-bubbles','pop');

      window.setTimeout(function(){
        stage.setAttribute('data-sparkle','1');
        captionMl.textContent = 'ഹോ! ഇപ്പോൾ ഒരു ' + bird.ml + ' ആയി!';
        captionEn.textContent = bird.en + ' Still not a crane, though.';
        caption.classList.add('visible');
        stage.setAttribute('aria-label', 'കാക്ക കുളിച്ച് ' + bird.ml + ' ആയി മാറിയ ദൃശ്യം');
        soapBtn.classList.remove('visible');
        resetBtn.classList.add('visible');
      }, 150);
    }, 1300);
  });

  resetBtn.addEventListener('click', resetAll);

  resetAll();
})();
</script>
